<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de exemplos TikZ</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
  }

  h1 {
    text-align: center;
    font-weight: 400;
    margin-bottom: 12px;
  }

  .contador {
    text-align: center;
    color: #aaa;
    margin-bottom: 24px;
  }

  .filtro {
    display: block;
    width: 100%;
    max-width: 600px;
    margin: 0 auto 24px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #e0e0e0;
    font-size: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
    gap: 16px;
  }

  .card {
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    background: #222;
    border: 1px solid #333;
    border-radius: 10px;
    overflow: hidden;
    transition: transform .15s, border-color .15s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: #777;
  }

  .card:focus-visible, .fechar:focus-visible {
    outline: 3px solid #75baff;
    outline-offset: 3px;
  }

  .card img {
    display: block;
    width: 100%;
    height: 200px;
    object-fit: contain;
    background: #fff;
  }

  .nome {
    display: block;
    padding: 10px 12px;
    font-family: ui-monospace, monospace;
    font-size: 14px;
    color: #bbb;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
  }

  .vazio {
    text-align: center;
    color: #aaa;
    padding: 30px;
  }

  .modal {
    width: 100vw;
    max-width: 100vw;
    height: 100vh;
    max-height: 100vh;
    margin: 0;
    padding: 60px 20px;
    border: 0;
    background: rgba(0, 0, 0, .94);
    color: #fff;
  }

  .modal[open] {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal::backdrop {
    background: rgba(0, 0, 0, .8);
  }

  .modal img {
    max-width: 100%;
    max-height: calc(100dvh - 140px);
    object-fit: contain;
    border-radius: 8px;
  }

  .fechar {
    position: absolute;
    top: 12px;
    right: 20px;
    padding: 4px 12px;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 36px;
    cursor: pointer;
  }

  .legenda {
    position: absolute;
    bottom: 16px;
    left: 20px;
    right: 20px;
    max-height: 50px;
    overflow: auto;
    text-align: center;
    overflow-wrap: anywhere;
    font-family: ui-monospace, monospace;
    color: #ccc;
  }
</style>
</head>

<p class="vazio" id="vazio" hidden>Nenhuma imagem encontrada.</p>

<dialog class="modal" id="modal" aria-label="Imagem ampliada">
  <button class="fechar" id="fechar" type="button" aria-label="Fechar">&times;</button>
  <img id="modalImg" alt="">
  <div class="legenda" id="modalLegenda"></div>
</dialog>

<script>
const filtro = document.getElementById('filtro');
const cards = [...document.querySelectorAll('.card')];
const contador = document.getElementById('contador');
const vazio = document.getElementById('vazio');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalLegenda = document.getElementById('modalLegenda');

function atualizarFiltro() {
  const busca = filtro.value.toLowerCase().trim();
  let visiveis = 0;

  cards.forEach(card => {
    const mostrar = card.dataset.nome.includes(busca);
    card.hidden = !mostrar;
    if (mostrar) visiveis++;
  });

  contador.textContent = `${visiveis} de ${cards.length} imagens`;
  vazio.hidden = visiveis > 0;
}

function abrirModal(src, nome) {
  modalImg.src = src;
  modalImg.alt = nome;
  modalLegenda.textContent = nome;
  modal.showModal();
}

function fecharModal() {
  modal.close();
}

cards.forEach(card => {
  card.addEventListener('click', () => {
    const img = card.querySelector('img');
    abrirModal(img.src, img.alt);
  });
});

filtro.addEventListener('input', atualizarFiltro);
document.getElementById('fechar').addEventListener('click', fecharModal);

// Fecha ao clicar no espaço ao redor da imagem.
// A tecla Escape é tratada automaticamente pelo dialog.
modal.addEventListener('click', event => {
  if (event.target === modal) fecharModal();
});

modal.addEventListener('close', () => {
  modalImg.removeAttribute('src');
});

atualizarFiltro();
</script>
